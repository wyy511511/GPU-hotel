<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPU Hotel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=Noto+Sans+SC:wght@400;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: a candy-colored hotel building (one window per GPU, little guests inside) with the lobby queue under it on the left; front desk or model shelf on the right; day cards float over the page. One light pastel look by choice. */
:root {
  color-scheme: light;
  --sky: #e7eaff; --sky2: #fbe9f4; --panel: #ffffff; --ink: #2f2b52; --muted: #7a76a3; --line: #e8e5f8;
  --btn: #7a7fff; --btn-d: #5a5fdc; --pink: #ff86ad; --pink-d: #e0628c;
  --chat: #ffc94d; --img: #4fd3b0; --vid: #ff86ad; --aud: #b39bff;
  --wall: #ffe0ec; --wall-d: #f8c3d6; --win: #3d3a6b; --lamp: #fff3c4; --bad: #ff5d6c; --good: #1fae6a; --gold: #ffad1f;
  --display: "Baloo 2", "ZCOOL KuaiLe", "Noto Sans SC", system-ui, sans-serif;
  --body: "Nunito", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
body { background: linear-gradient(180deg, var(--sky), var(--sky2)) fixed; color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; font-weight: 500;
  padding-block: .75rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 74rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
h1, h2, h3, .display { font-family: var(--display); }
button, select { font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: .35rem .8rem; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .08s; }
button:hover:not(:disabled) { border-color: var(--btn); }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
button:disabled { opacity: .45; cursor: default; }
button.primary, button[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: #fff; box-shadow: 0 3px 0 var(--btn-d); }
button.pink { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: 0 3px 0 var(--pink-d); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--btn); outline-offset: 2px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: .5rem; position: relative; z-index: 30; }
.lang { position: relative; margin-left: auto; }
#langBtn { display: inline-flex; align-items: center; gap: .5rem; }
#langBtn .code { font-family: var(--display); color: var(--btn); letter-spacing: .04em; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: .35rem; min-width: 11rem; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 12px 30px rgba(70, 60, 150, .18); }
.menu[hidden] { display: none; }
.menu button { width: 100%; text-align: left; border: 0; box-shadow: none; display: flex; justify-content: space-between; align-items: center; gap: 1rem; border-radius: 10px; }
.menu button:hover { background: var(--sky); }
.menu button[aria-checked="true"] { color: var(--btn); background: var(--sky); }
.menu button small { color: var(--muted); }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 1rem 1.1rem; min-width: 0; box-shadow: 0 4px 0 var(--line); }
.panel > h2 { font-size: 1.05rem; margin: 0 0 .6rem; color: var(--ink); font-weight: 700; }
.hint { color: var(--muted); font-size: .82rem; margin: .35rem 0 0; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.neg { color: var(--bad); } .pos { color: var(--good); } .warn { color: #d9840b; }

/* start screen */
.start { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; text-align: center; padding-top: 1rem; }
.logo { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 9vw, 4.4rem); line-height: 1; margin: 0; color: var(--pink); text-shadow: 3px 3px 0 #fff, 6px 6px 0 var(--wall-d); letter-spacing: .02em; }
.logo small { display: block; font-size: .32em; color: var(--btn); text-shadow: none; letter-spacing: .1em; margin-top: .5rem; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; width: 100%; max-width: 50rem; }
.mode { text-align: left; display: flex; flex-direction: column; gap: .6rem; padding: 1.1rem 1.2rem 1.2rem; border-radius: 22px; }
.mode h2 { font-size: 1.35rem; margin: 0; }
.mode p { margin: 0; color: var(--muted); font-weight: 600; }
.mini { display: grid; grid-template-columns: repeat(6, 1.6rem); gap: .3rem; padding: .7rem; background: var(--wall); border-radius: 14px; border: 3px solid var(--wall-d); width: max-content; max-width: 100%; }
.mini span { width: 1.6rem; height: 1.6rem; border-radius: 6px; background: var(--win); position: relative; }

/* game header */
.gamehead { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 2rem; line-height: 1; color: var(--pink); text-shadow: 2px 2px 0 #fff, 4px 4px 0 var(--wall-d); font-weight: 800; }
.chip { font-family: var(--display); font-weight: 700; background: var(--btn); color: #fff; border-radius: 999px; padding: .15rem .75rem; font-size: .9rem; }
.intro { margin: .2rem 0 0; color: var(--muted); max-width: 46rem; font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: .6rem; }
.kpi { background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: .55rem .85rem; min-width: 0; box-shadow: 0 3px 0 var(--line); }
.kpi b { display: block; font-family: var(--display); font-size: 1.45rem; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi span { color: var(--muted); font-size: .78rem; line-height: 1.3; display: block; font-weight: 700; }
.dayline { position: relative; height: 12px; background: #fff; border: 2px solid var(--line); border-radius: 999px; }
.dayline i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--chat), var(--pink)); border-radius: 999px; }
.dayline b { position: absolute; top: 50%; left: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--chat); box-shadow: 0 0 0 3px #fff, 0 0 12px var(--chat); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }

/* the hotel */
.hotel { position: relative; padding-top: 1.6rem; }
.sign { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2; font-family: var(--display); font-weight: 800; color: #fff; background: var(--pink); padding: .2rem 1.1rem; border-radius: 999px; box-shadow: 0 3px 0 var(--pink-d); letter-spacing: .08em; white-space: nowrap; }
.building { background: var(--wall); border: 4px solid var(--wall-d); border-radius: 26px 26px 10px 10px; padding: 1.5rem .8rem .8rem; }
.grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.w { aspect-ratio: 1; border-radius: 9px; background: var(--win); position: relative; overflow: hidden; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); transition: background .25s; }
.w.chat { --c: var(--chat); } .w.img { --c: var(--img); } .w.vid { --c: var(--vid); } .w.aud { --c: var(--aud); }
.w.idle, .w.busy, .w.loading { background: var(--lamp); }
.w.idle { box-shadow: inset 0 -5px 0 var(--c); }
.w.loading { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 55%, var(--lamp)) 0 5px, var(--lamp) 5px 10px); background-size: 200% 200%; animation: sweep 1.2s linear infinite; }
@keyframes sweep { to { background-position: 28px 0; } }
.w i { display: none; position: absolute; left: 16%; right: 16%; top: 22%; bottom: 8%; border-radius: 48% 48% 40% 40%;
  background: radial-gradient(circle at 34% 42%, var(--ink) 0 7%, transparent 8%), radial-gradient(circle at 66% 42%, var(--ink) 0 7%, transparent 8%), radial-gradient(ellipse at 50% 62%, #ff9fb8 0 9%, transparent 10%) 0 0 / 0 0, var(--c); }
.w i::after { content: ""; position: absolute; left: 40%; width: 20%; top: 56%; height: 10%; border-bottom: 2px solid var(--ink); border-radius: 0 0 50% 50%; }
.w.busy i { display: block; animation: bob 1.6s ease-in-out infinite; }
.w.lane i { opacity: .6; }
.w.down { background: repeating-linear-gradient(45deg, #b9b6cf 0 4px, #d8d5ea 4px 8px); }
.w.slow { box-shadow: inset 0 0 0 3px var(--bad); }
.w.slow.busy i::before { content: ""; position: absolute; right: -6%; top: 6%; width: 18%; height: 22%; background: #7fd0ff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
.w.burst { outline: 2px dashed var(--gold); outline-offset: -2px; }
.w.tb::after { content: ""; position: absolute; right: 3px; top: 3px; width: 26%; height: 26%; background: var(--gold); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
@keyframes bob { 50% { transform: translateY(-6%); } }
@media (prefers-reduced-motion: reduce) { .w.loading, .w.busy i, .g.mad { animation: none; } .w { transition: none; } }
.legend { display: flex; flex-wrap: wrap; gap: .35rem .9rem; color: var(--muted); font-size: .78rem; font-weight: 700; margin-top: .7rem; }
.legend i { display: inline-block; width: .85rem; height: .85rem; border-radius: 4px; vertical-align: -2px; margin-right: .35rem; }
.ticker { min-height: 1.4rem; color: var(--btn-d); font-size: .88rem; font-weight: 800; margin-top: .5rem; }

/* lobby */
.lob { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) auto; gap: .5rem; align-items: center; padding: .45rem 0; border-top: 2px dashed var(--line); }
.lob:first-of-type { border-top: 0; }
.lob .nm { font-weight: 800; font-size: .88rem; display: flex; align-items: center; gap: .4rem; min-width: 0; }
.dot { width: .8rem; height: .8rem; border-radius: 50%; background: var(--c); flex: none; }
.line { display: flex; flex-wrap: wrap; gap: 3px; min-height: 18px; align-items: center; }
.g { width: 16px; height: 16px; border-radius: 50% 50% 44% 44%; background: radial-gradient(circle at 34% 45%, var(--ink) 0 9%, transparent 10%), radial-gradient(circle at 66% 45%, var(--ink) 0 9%, transparent 10%), var(--c); }
.g.mad { background: radial-gradient(circle at 34% 48%, var(--ink) 0 9%, transparent 10%), radial-gradient(circle at 66% 48%, var(--ink) 0 9%, transparent 10%), linear-gradient(var(--bad), var(--bad)) 50% 18% / 70% 9% no-repeat, color-mix(in srgb, var(--c) 55%, var(--bad)); animation: shake .4s ease-in-out infinite; }
@keyframes shake { 25% { transform: translateX(-1px) rotate(-6deg); } 75% { transform: translateX(1px) rotate(6deg); } }
.more { font-size: .78rem; color: var(--muted); font-weight: 800; }
.lob .cnt { font-family: var(--display); font-weight: 700; font-size: .9rem; white-space: nowrap; }
.sad { margin: .4rem 0 0; font-size: .82rem; color: var(--bad); font-weight: 800; }
canvas { width: 100%; height: 120px; display: block; }

/* desk / shelf */
.mrow { padding: .6rem .7rem; border: 2px solid var(--line); border-left: 6px solid var(--c); border-radius: 14px; margin-bottom: .55rem; }
.mrow.closed { border-left-style: dashed; }
.mhead { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .5rem; }
.mhead b { font-family: var(--display); font-size: 1.02rem; font-weight: 700; } .mhead small { color: var(--muted); font-weight: 700; }
.mdesc { margin: .1rem 0 0; font-size: .8rem; color: var(--muted); font-weight: 600; }
.catgrp > h3 { font-size: .95rem; margin: .4rem 0 .45rem; color: var(--ink); display: flex; align-items: center; gap: .4rem; }
.bdg { font-size: .7rem; line-height: 1.6; border-radius: 999px; padding: 0 .5rem; background: var(--sky); color: var(--muted); font-weight: 800; white-space: nowrap; }
.bdg.closed { background: color-mix(in srgb, var(--aud) 25%, #fff); color: #6b4fd6; }
.bdg.turbo { background: color-mix(in srgb, var(--gold) 25%, #fff); color: #a76400; }
.bdg.new { background: color-mix(in srgb, var(--good) 18%, #fff); color: var(--good); }
.stat { display: grid; gap: .25rem; margin: .4rem 0 .3rem; }
.qbar { height: .55rem; background: var(--sky); border-radius: 999px; overflow: hidden; }
.qbar i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 999px; }
.nums { font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--muted); font-weight: 700; }
.nums b { color: var(--ink); }
.ctl { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 3rem; gap: .2rem .6rem; align-items: center; margin-bottom: .35rem; }
.ctl.wide { grid-template-columns: minmax(0, 1fr) 3.4rem; } .ctl.wide label { grid-column: 1 / -1; }
.ctl label { font-size: .82rem; line-height: 1.35; font-weight: 700; }
.ctl output { font-family: var(--display); font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; }
input[type=range] { width: 100%; accent-color: var(--btn); }
.owned { display: flex; flex-wrap: wrap; gap: .35rem; }
.owned span { font-size: .78rem; background: var(--sky); border-radius: 999px; padding: .1rem .6rem; color: var(--btn-d); font-weight: 800; }
.tab { width: 100%; border-collapse: collapse; font-size: .82rem; }
.tab th { text-align: left; color: var(--muted); font-weight: 800; padding: .2rem .5rem .35rem 0; white-space: nowrap; }
.tab td { padding: .35rem .5rem .35rem 0; border-top: 2px solid var(--line); vertical-align: top; }
.tab td.n { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
.notes td:first-child { font-weight: 800; white-space: nowrap; }

/* cards */
.veil { position: fixed; inset: 0; background: color-mix(in srgb, var(--sky) 70%, transparent); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 20;
  padding: calc(3.8rem + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.veil[hidden] { display: none; }
.card { background: #fff; border: 3px solid var(--line); border-radius: 26px; padding: 1.3rem 1.4rem 1.4rem; max-width: 46rem; width: 100%; display: flex; flex-direction: column; gap: .8rem; box-shadow: 0 6px 0 var(--line), 0 20px 50px rgba(70, 60, 150, .18); }
.card .eyebrow { align-self: flex-start; font-family: var(--display); font-weight: 700; color: #fff; background: var(--pink); border-radius: 999px; padding: .05rem .75rem; font-size: .85rem; }
.card h2 { font-size: 1.6rem; margin: 0; line-height: 1.2; text-wrap: balance; }
.card p { margin: 0; }
.card .src { color: var(--btn-d); font-size: .85rem; font-weight: 700; background: var(--sky); border-radius: 14px; padding: .55rem .8rem; }
.card h3 { font-size: 1rem; margin: .3rem 0 0; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .55rem; }
.opt { text-align: left; padding: .65rem .8rem; display: flex; flex-direction: column; gap: .15rem; border-radius: 16px; font-weight: 700; }
.opt b { font-family: var(--display); font-size: 1rem; } .opt small { color: var(--muted); font-size: .8rem; line-height: 1.45; font-weight: 600; }
.opt .cost { font-family: var(--display); color: var(--btn-d); }
.opt.picked { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, #fff); }
.shelf { display: flex; flex-direction: column; gap: .4rem; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .3rem .8rem; align-items: center; padding: .5rem .7rem; border: 2px solid var(--line); border-left: 6px solid var(--c); border-radius: 14px; }
.srow.closed { border-left-style: dashed; }
.srow .meta { font-size: .8rem; color: var(--muted); font-weight: 600; }
.srow .note { font-size: .8rem; grid-column: 1 / -1; font-weight: 700; }
.srow button { white-space: nowrap; }
.srow button.on { border-color: var(--good); color: var(--good); }
table.rep { border-collapse: collapse; width: 100%; font-size: .92rem; }
.rep td { padding: .32rem 0; border-top: 2px solid var(--line); }
.rep td:last-child { text-align: right; font-variant-numeric: tabular-nums; padding-left: 1rem; font-weight: 800; }
.big { font-family: var(--display); font-weight: 800; font-size: 2.6rem; color: var(--pink); line-height: 1; text-shadow: 2px 2px 0 var(--wall); }
.stars { color: var(--gold); letter-spacing: .05em; }
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button id="newgame" hidden></button>
    <div class="lang">
      <button id="langBtn" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu"><span class="code" id="langCode">EN</span><span data-i18n="lang">Language</span><span aria-hidden="true">▾</span></button>
      <div class="menu" id="langMenu" role="menu" hidden></div>
    </div>
  </div>

  <section class="start" id="start">
    <h1 class="logo">GPU HOTEL<small data-i18n="st_pick"></small></h1>
    <div class="modes">
      <div class="panel mode">
        <div class="mini" aria-hidden="true" id="mini1"></div>
        <h2 data-i18n="st_easy_t"></h2><p data-i18n="st_easy_d"></p>
        <button class="pink" data-mode="easy" data-i18n="play"></button>
      </div>
      <div class="panel mode">
        <div class="mini" aria-hidden="true" id="mini2"></div>
        <h2 data-i18n="st_pro_t"></h2><p data-i18n="st_pro_d"></p>
        <button class="primary" data-mode="pro" data-i18n="play"></button>
      </div>
    </div>
    <p class="hint" data-i18n="st_note"></p>
  </section>

  <section id="game" hidden>
    <div class="col">
      <div class="gamehead">
        <div>
          <div class="brand"><h1>GPU HOTEL</h1><span class="chip" id="chip"></span></div>
          <p class="intro" id="intro"></p>
        </div>
        <div class="row">
          <button id="pause" aria-pressed="false"></button>
          <button class="spd" data-s="1" aria-pressed="true">1×</button>
          <button class="spd" data-s="2" aria-pressed="false">2×</button>
          <button class="spd" data-s="4" aria-pressed="false">4×</button>
        </div>
      </div>
      <section class="kpis" data-i18n-aria="a_kpis">
        <div class="kpi"><b id="k-day"></b><span id="k-clock"></span></div>
        <div class="kpi"><b id="k-cash">$0</b><span id="l-cash"></span></div>
        <div class="kpi"><b id="k-today">$0</b><span id="l-today"></span></div>
        <div class="kpi"><b id="k-rep"></b><span id="l-rep"></span></div>
        <div class="kpi"><b id="k-5"></b><span id="l-5"></span></div>
        <div class="kpi"><b id="k-6"></b><span id="l-6"></span></div>
      </section>
      <div class="dayline" aria-hidden="true"><i id="dayline"></i><b id="sun"></b></div>
      <div class="main">
        <div class="col">
          <div class="panel">
            <div class="hotel"><div class="sign">GPU HOTEL</div><div class="building"><div class="grid" id="grid" data-i18n-aria="a_grid"></div></div></div>
            <div class="legend" id="legend"></div>
            <div class="ticker" id="ticker" aria-live="polite"></div>
          </div>
          <div class="panel"><h2 id="t-lobby"></h2><div id="lobby"></div><p class="sad" id="sad"></p></div>
          <div class="panel"><h2 id="t-chart"></h2><canvas id="chart" width="900" height="240"></canvas></div>
          <div class="panel" id="custPanel"><h2 id="t-cust"></h2><div style="overflow-x:auto"><table class="tab" id="ctab"></table></div><p class="hint" id="custHint"></p></div>
        </div>
        <div class="col">
          <div class="panel" id="desk"></div>
          <div class="panel">
            <h2 id="t-policy"></h2>
            <div class="ctl"><label for="keep" id="l-keep"></label><input type="range" id="keep" min="0" max="300" step="5" value="60"><output id="o-keep"></output></div>
            <div class="ctl wide"><label for="win" id="l-win"></label><input type="range" id="win" min="0" max="100" value="20"><output id="o-win"></output></div>
            <div class="ctl wide"><label for="surge" id="l-surge"></label><input type="range" id="surge" min="100" max="250" step="10" value="100"><output id="o-surge"></output></div>
            <div class="row" style="margin-top:.4rem"><label for="policy" id="l-order" style="font-weight:700;font-size:.85rem"></label>
              <select id="policy"><option value="fifo" id="o-fifo"></option><option value="rich" id="o-rich"></option><option value="short" id="o-short"></option></select>
            </div>
            <div class="row" style="margin-top:.8rem"><button id="burst"></button><button id="limit" aria-pressed="false"></button></div>
            <p class="hint" id="burst-hint"></p>
          </div>
          <div class="panel"><h2 id="t-owned"></h2><div class="owned" id="owned"></div></div>
        </div>
      </div>
      <div class="panel"><h2 id="t-notes"></h2><div style="overflow-x:auto"><table class="tab notes" id="notes"></table></div><p class="hint" id="notesHint"></p></div>

    return `<div class="lob" style="--c:var(--${gr.c})"><div class="nm"><span class="dot"></span>${catName(gr.c)}</div><div class="line">${blobs}${n > show ? `<span class="more">+${n - show}</span>` : ''}</div><div class="cnt">${T('lobby_n', { n })}</div></div>`;
  }).join('');
  $('sad').textContent = D.lostN ? T('left_n', { n: D.lostN.toLocaleString('en-US') }) : '';
}
function renderCust() {
  if (MODE !== 'pro') return;
  const uses = k => CK.filter(c => k.f[c]).map(c => T('c_' + c)).join(', ');
  const st = k => !G.act[k.id] ? (G.gone === k.id ? 'st_gone' : 'st_churn') : G.pm[k.id] ? 'st_deal' : G.strikes[k.id] ? 'st_strike' : 'st_active';
  const tot = CUST.reduce((a, k) => a + D.kc[k.id].rev, 0);
  $('ctab').innerHTML = `<thead><tr>${T('ccols').map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${CUST.map(k => {
    const K = D.kc[k.id], s = st(k);
    return `<tr><td>${TV('cn')[k.id]}</td><td>${uses(k)}</td><td class="n">${money(K.paid)}</td><td class="n">${money(K.rev)} <span style="color:var(--muted)">${tot > 0 ? pctf(K.rev / tot) : ''}</span></td><td class="${s === 'st_churn' || s === 'st_gone' ? 'neg' : s === 'st_strike' || s === 'st_deal' ? 'warn' : ''}">${T(s)}</td></tr>`;
  }).join('')}</tbody>`;
}
function renderHud() {
  $('k-day').textContent = T('day', { n: G.day });
  const hh = D.t / DAY * 24, time = `${String(Math.floor(hh) % 24).padStart(2, '0')}:${String(Math.floor(hh % 1 * 60)).padStart(2, '0')}`;
  $('k-clock').textContent = T('clock', { time, n: DAYS });
  const today = D.revOpen + D.revTake + D.sub - D.cost;
  $('k-cash').textContent = money(G.cash + (running ? today : 0)); $('k-cash').className = G.cash + today < 0 ? 'neg' : '';
  $('k-today').textContent = money(today); $('k-today').className = today < 0 ? 'neg' : 'pos';
  $('k-rep').innerHTML = MODE === 'easy' ? `<em class="stars" style="font-style:normal">★</em> ${starsOf(G.rep)}` : Math.round(G.rep);
  if (MODE === 'easy') { $('k-5').textContent = pctf(D.util); const ls = D.lostN / Math.max(1, D.lostN + D.servedN); $('k-6').innerHTML = `${D.lostN.toLocaleString('en-US')} <small style="font-size:.6em;color:var(--muted)">${(ls * 100).toFixed(1)}%</small>`; $('k-6').className = ls > .05 ? 'neg' : ''; }
  else {
    const cov = D.inV + D.missV > 0 ? D.inV / (D.inV + D.missV) : 1;
    $('k-5').textContent = pctf(cov); $('k-5').className = cov < .7 ? 'warn' : '';
    $('k-6').textContent = (D.lostV / Math.max(1, D.lostV + D.servedV) * 100).toFixed(1) + '%'; $('k-6').className = '';
  }
  const f = D.t / DAY * 100; $('dayline').style.width = f + '%'; $('sun').style.left = f + '%';
  $('burst').disabled = !running || D.bursts >= 3;
  $('burst-hint').textContent = T('bhint', { b: (RATE.burst * D.burstMult).toFixed(1), o: RATE.own, s: RATE.sublet * (G.up.spot ? 2 : 1), n: 3 - D.bursts });
}
function render() {
  if (!D) return;
  if (cells.length !== gpus.length) buildGrid();
  gpus.forEach((g, i) => { const m = g.m && MI[g.m]; const c = 'w ' + (g.state === 'off' ? '' : g.state === 'down' ? 'down' : g.state + ' ' + (m ? m.cat : '')) + (g.lane ? ' lane' : '') + (g.kind === 'burst' ? ' burst' : '') + (g.slow ? ' slow' : '') + (m && isTurbo(m) ? ' tb' : ''); if (cells[i].className !== c) cells[i].className = c; });
  for (const c of CK) {
    const mkt = CATALOG.filter(m => m.cat === c && inMarket(m)), SA = mkt.reduce((a, m) => a + attract(m), 0);
    for (const m of mkt) {
      if (!isListed(m) || !$('mn-' + m.id)) continue;
      const q = Q[m.id] || [];
      if (MODE === 'easy') { $('qb-' + m.id).style.width = Math.min(100, q.length / (m.batch * 12) * 100) + '%'; $('mn-' + m.id).innerHTML = T('meta', { n: `<b>${cnt(m.id)}</b>`, q: `<b>${q.length}</b>` }); continue; }
      const share = SA ? pctf(attract(m) / SA) : '0%', p95 = pct(lat[m.id], .95), rev = money(D.mrev[m.id] || 0);
      if (m.kind === 'open') { $('qb-' + m.id).style.width = Math.min(100, q.length / (m.batch * 12) * 100) + '%'; $('mn-' + m.id).innerHTML = T('row_open', { share, cat: T('c_' + c), q: q.length, p: p95, r: cnt(m.id), rev }); }
      else { const u = D.capT[m.id] ? Math.min(1, (D.capU[m.id] || 0) / D.capT[m.id]) : 0; $('qb-' + m.id).style.width = (q.length ? 100 : u * 100) + '%'; $('mn-' + m.id).innerHTML = T('row_closed', { share, cat: T('c_' + c), u: pctf(u), p: p95, rev }); }
    }
  }
  renderLobby(); renderCust(); renderHud(); drawChart();
}
function startGame(mode) {
  initMode(mode); t = 0; lastSay = null; running = false;
  $('start').hidden = true; $('game').hidden = false; $('newgame').hidden = false;
  $('keep').value = 60; $('win').value = 20; $('surge').value = 100; $('policy').value = 'fifo';
  buildGrid(); applyLang(); morning();
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => startGame(b.dataset.mode));
$('newgame').onclick = () => location.reload();
// start-screen mini hotels
(() => {
  const pat = [['', 'chat', 'img', '', 'vid', 'chat'], ['img', '', 'vid', 'chat', '', 'img'], ['vid', 'img', '', 'img', 'chat', '']];
  const fill = (id, cats) => { $(id).innerHTML = pat.flat().map((c, i) => c ? `<span class="w busy ${cats[i % cats.length] || c}" style="aspect-ratio:auto"><i></i></span>` : `<span></span>`).join(''); };
  fill('mini1', ['chat', 'img', 'vid']); fill('mini2', ['img', 'vid', 'aud']);
})();
setInterval(() => { if (!paused && running) for (let i = 0; i < speed && running; i++) step(); }, 80);
setInterval(render, 200);
// headless balance hook
window.__auto = (mode, o = {}) => {
  initMode(mode); newDay();
  for (; G.day <= DAYS; G.day++) {
    setupDay();
    for (const m of CATALOG) if (o.listAll && G.day >= availDay(m) && !removed(m) && !isListed(m) && !(o.skip || []).includes(m.id)) setListed(m, true);
    for (const id of o.turbo || []) if (MI[id] && !G.turbo[id] && isListed(MI[id]) && G.cash >= TURBO_COST) { G.cash -= TURBO_COST; G.turbo[id] = G.day + 1; }
    for (const u of o.ups || []) { const U = UPG.find(x => x.id === u); if (U && !G.up[u] && G.cash >= U.cost) { G.cash -= U.cost; G.up[u] = true; if (u === 'deal') for (let i = 0; i < 30; i++) gpus.push(mk('own', RATE.contract)); if (u === 'devprog') { G.rep = Math.min(100, G.rep + 8); G.selfMult *= 1.1; } } }
    if (o.mw) Object.assign(P.minWarm, o.mw); if (o.keep != null) P.keep = o.keep;
    const ev = EVENTS[G.day - 1]; if (ev.choices) ev.choices[o.pick != null ? o.pick : 1].fn();
    openDay(); while (running) step();
    if (G.cash < -20000) return { broke: true, hist: G.hist, rep: G.rep };
  }
  G.day = DAYS; const V = valuation(false);
  return { cash: G.cash, rep: G.rep, hist: G.hist, V };
};
applyLang();
