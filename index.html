<title>GPU Hotel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: hotel facade (one window per GPU) plus customers on the left; the model shelf (one API key) and house policy on the right; morning briefings as cards; language picker pinned top-right above the cards. Single dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #0c111d; --panel: #141b2c; --panel2: #1a2338; --fg: #e8ebf3; --muted: #8d97ae; --rule: #28324a;
  --off: #1d2540; --gold: #f2b84b; --img: #4fd1c5; --vid: #f0709a; --aud: #f5c15c; --closed: #9d8cf5; --bad: #ff6b5e; --good: #7bd88f;
  --num: "Space Grotesk", "Inter", "Noto Sans SC", system-ui, sans-serif;
  --body: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.6;
  padding-block: .75rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 74rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.topbar { display: flex; justify-content: flex-end; position: relative; z-index: 30; }
.lang { position: relative; }
#langBtn { display: inline-flex; align-items: center; gap: .55rem; padding: .3rem .7rem; }
#langBtn .code { font-family: var(--num); font-weight: 700; color: var(--gold); letter-spacing: .06em; }
#langBtn .caret { color: var(--muted); font-size: .7rem; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: .3rem; min-width: 11rem; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 10px 28px rgba(0, 0, 0, .45); }
.menu[hidden] { display: none; }
.menu button { width: 100%; text-align: left; background: transparent; border-color: transparent; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.menu button:hover { background: var(--panel2); }
.menu button[aria-checked="true"] { color: var(--gold); font-weight: 700; }
.menu button small { color: var(--muted); font-family: var(--num); font-weight: 500; }
header { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: flex-end; justify-content: space-between; }
h1 { font-family: var(--num); font-size: 1.75rem; line-height: 1.1; margin: 0; letter-spacing: .02em; color: var(--gold); text-shadow: 0 0 18px color-mix(in srgb, var(--gold) 45%, transparent); }
h1 span { font-family: var(--body); font-size: .95rem; color: var(--fg); font-weight: 500; text-shadow: none; margin-left: .6rem; letter-spacing: 0; }
.sub { margin: .25rem 0 0; color: var(--muted); max-width: 44rem; }
.bar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
button, select { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--rule); border-radius: 4px; padding: .35rem .7rem; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--gold); }
button:disabled { opacity: .45; cursor: default; }
button[aria-pressed="true"], button.primary { background: var(--gold); color: #1a1405; border-color: var(--gold); font-weight: 700; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .5rem; }
.kpi { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: .55rem .8rem; min-width: 0; }
.kpi b { display: block; font-family: var(--num); font-size: 1.3rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi span { color: var(--muted); font-size: .78rem; line-height: 1.35; display: block; }
.neg { color: var(--bad); } .pos { color: var(--good); } .warn { color: var(--gold); }
.dayline { height: 6px; background: var(--off); border-radius: 3px; overflow: hidden; }
.dayline i { display: block; height: 100%; width: 0; background: var(--gold); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 1rem; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: .9rem 1rem; min-width: 0; }
.panel h2 { font-size: .8rem; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin: 0 0 .7rem; }
.facade { background: linear-gradient(#10172a, #0e1424); border: 1px solid var(--rule); border-top: 4px solid var(--gold); border-radius: 4px 4px 0 0; padding: .9rem; }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.w { aspect-ratio: 1 / .9; border-radius: 2px; background: var(--off); transition: background .2s; }
.w.img { --c: var(--img); } .w.vid { --c: var(--vid); } .w.aud { --c: var(--aud); }
.w.idle { background: color-mix(in srgb, var(--c) 26%, var(--off)); }
.w.busy { background: var(--c); box-shadow: 0 0 9px color-mix(in srgb, var(--c) 70%, transparent); }
.w.lane { opacity: .7; box-shadow: none; }
.w.loading { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 60%, var(--off)) 0 4px, var(--off) 4px 8px); animation: flick .7s steps(2) infinite; }
.w.down { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--bad) 55%, var(--off)) 0 3px, #120a10 3px 6px); }
.w.slow { outline: 1px solid var(--bad); outline-offset: 1px; }
.w.tb { outline: 1px solid var(--gold); outline-offset: 1px; }
.w.burst { outline: 1px dashed var(--gold); outline-offset: 1px; }
@keyframes flick { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .w.loading { animation: none; } .w { transition: none; } }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; color: var(--muted); font-size: .78rem; }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: 2px; vertical-align: -1px; margin-right: .35rem; }
.ticker { min-height: 1.5rem; color: var(--gold); font-size: .85rem; margin-top: .6rem; }
canvas { width: 100%; height: 120px; display: block; }
.catgrp { border-top: 1px solid var(--rule); padding-top: .6rem; margin-top: .6rem; }
.catgrp:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.catgrp > h3 { font-size: .78rem; letter-spacing: .06em; margin: 0 0 .4rem; color: var(--c); font-weight: 700; }
.mrow { padding: .45rem .6rem; border-left: 3px solid var(--c); background: var(--panel2); border-radius: 0 4px 4px 0; margin-bottom: .45rem; }
.mrow.closed { border-left-style: dashed; }
.mhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .5rem; }
.mhead b { font-size: .9rem; } .mhead small { color: var(--muted); font-size: .75rem; }
.bdg { font-size: .68rem; line-height: 1.5; border: 1px solid var(--rule); border-radius: 3px; padding: 0 .35rem; color: var(--muted); white-space: nowrap; }
.bdg.closed { color: var(--closed); border-color: color-mix(in srgb, var(--closed) 50%, var(--rule)); }
.bdg.turbo { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, var(--rule)); }
.bdg.new { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, var(--rule)); }
.stat { display: grid; grid-template-columns: minmax(0, 1fr); gap: .25rem; margin: .3rem 0 .2rem; }
.qbar { height: .45rem; background: var(--off); border-radius: 2px; overflow: hidden; }
.qbar i { display: block; height: 100%; width: 0; background: var(--c); }
.nums { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: .76rem; color: var(--muted); }
.nums b { color: var(--fg); }
.ctl { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 3rem; gap: .2rem .6rem; align-items: center; margin-bottom: .3rem; }
.ctl.wide { grid-template-columns: minmax(0, 1fr) 3.4rem; } .ctl.wide label { grid-column: 1 / -1; }
.ctl label { font-size: .8rem; line-height: 1.35; }
.ctl output { font-family: var(--num); font-variant-numeric: tabular-nums; text-align: right; font-size: .85rem; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.hint { color: var(--muted); font-size: .78rem; margin: .3rem 0 0; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.owned { display: flex; flex-wrap: wrap; gap: .35rem; }
.owned span { font-size: .75rem; border: 1px solid var(--rule); border-radius: 3px; padding: .1rem .45rem; color: var(--muted); }
.ctab { width: 100%; border-collapse: collapse; font-size: .8rem; }
.ctab th { text-align: left; color: var(--muted); font-weight: 500; padding: .2rem .4rem .3rem 0; white-space: nowrap; }
.ctab td { padding: .3rem .4rem .3rem 0; border-top: 1px solid var(--rule); vertical-align: top; }
.ctab td.n { font-family: var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.veil { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 20;
  padding: calc(3.6rem + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.veil[hidden] { display: none; }
.card { background: var(--panel); border: 1px solid var(--rule); border-top: 4px solid var(--gold); border-radius: 4px; padding: 1.25rem 1.4rem; max-width: 46rem; width: 100%; display: flex; flex-direction: column; gap: .8rem; }
.card .eyebrow { font-family: var(--num); color: var(--gold); letter-spacing: .08em; font-size: .78rem; }
.card h2 { font-size: 1.35rem; margin: 0; line-height: 1.3; text-wrap: balance; }
.card p { margin: 0; }
.card .src { color: var(--muted); font-size: .8rem; border-left: 2px solid var(--rule); padding-left: .7rem; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .5rem; }
.opt { text-align: left; padding: .6rem .75rem; display: flex; flex-direction: column; gap: .15rem; }
.opt b { font-size: .9rem; } .opt small { color: var(--muted); font-size: .76rem; line-height: 1.45; }
.opt .cost { font-family: var(--num); color: var(--gold); font-size: .85rem; }
.opt.picked { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel2)); }
.card h3 { font-size: .8rem; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin: .3rem 0 0; }
.shelf { display: flex; flex-direction: column; gap: .35rem; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .3rem .8rem; align-items: center; padding: .45rem .6rem; background: var(--panel2); border-left: 3px solid var(--c); border-radius: 0 4px 4px 0; }
.srow.closed { border-left-style: dashed; }
.srow .meta { font-size: .76rem; color: var(--muted); }
.srow .note { font-size: .76rem; grid-column: 1 / -1; }
.srow button { white-space: nowrap; }
.srow button.on { border-color: var(--good); color: var(--good); }
table.rep { border-collapse: collapse; width: 100%; font-size: .88rem; }
.rep td { padding: .3rem 0; border-top: 1px solid var(--rule); }
.rep td:last-child { text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; padding-left: 1rem; }
.basis { min-width: 38rem; font-size: .8rem !important; }
.basis td { padding: .35rem .7rem .35rem 0 !important; text-align: left !important; font-family: var(--body) !important; vertical-align: top; }
.basis thead td { color: var(--muted); border-top: 0; }
.basis td:nth-child(2) { font-family: var(--num) !important; min-width: 9rem; }
.big { font-family: var(--num); font-size: 2.2rem; color: var(--gold); line-height: 1.1; }
</style>

<div class="wrap">

      <div class="menu" id="langMenu" role="menu" hidden></div>

  </div>
  <header>
    <div>

  <div class="dayline" aria-hidden="true"><i id="dayline"></i></div>

  <div class="main">
    <div class="col">
      <div>
        <div class="facade"><div class="grid" id="grid" data-i18n-aria="a_grid"></div></div>
        <div class="panel" style="border-top:0;border-radius:0 0 4px 4px">
          <div class="legend">

      <div class="panel">

    <div class="col">

      <div class="panel">

  </div>

</div>

// ================= helpers =================

const $ = id => document.getElementById(id);
const money = v => (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US');
const pctf = v => Math.round(v * 100) + '%';

const mSvc = m => m.svc * (G.up.fast ? .75 : 1) * (isTurbo(m) ? .35 : 1);

  running = false; setPaused(true);
  const loss = D.lostV / Math.max(1, D.lostV + D.servedV), cov = D.inV / Math.max(1, D.inV + D.missV);
  const lim = D.limitTicks / DAY;
  const repD = Math.max(-12, Math.min(10, Math.round(1 - 60 * loss - 4 * lim + 2 * Math.min(2, D.dz) - (cov < .8 ? Math.round(12 * (.8 - cov)) : 0))));
  const rev = D.revOpen + D.revTake + D.sub, profit = rev - D.cost;
  G.cash += profit; G.rep = Math.max(0, Math.min(100, G.rep + repD));
  // strict customers judge reliability in their main category
  const notes = [];
  for (const k of CUST) {
    if (!k.strict || !G.act[k.id]) continue;
    const x = D.kc[k.id][k.strict], share = x.l / Math.max(1e-9, x.l + x.s);
    if (x.l + x.s > 0 && share > .05) {
      G.strikes[k.id] = (G.strikes[k.id] || 0) + 1;
      if (G.strikes[k.id] >= 2) { G.act[k.id] = false; notes.push(['ev_churn', k.id]); } else notes.push(['ev_strike', k.id, k.strict, G.strikes[k.id]]);
    }
  }
  const custRev = Object.fromEntries(CUST.map(k => [k.id, D.kc[k.id].rev]));
  G.hist.push({ rev, profit, gmv: D.gmv, cost: D.cost, custRev, loss, cov, mlost: { ...D.mlost }, mrev: { ...D.mrev }, open: D.revOpen, take: D.revTake, sub: D.sub, util: D.util, cold: D.cold });
  const E = { day: G.day, open: D.revOpen, take: D.revTake, sub: D.sub, rent: D.cost, profit, gmv: D.gmv, cov, loss, cold: D.cold, repD, rep: G.rep, cash: G.cash, notes,
    tip: loss > .06 ? 't_loss' : cov < .7 ? 't_cov' : D.util < .3 ? 't_util' : D.cold > 450 ? 't_cold' : 't_ok', broke: G.cash < -20000, last: G.day >= DAYS };
  showCard(() => {
    const rows = [[T('r_open'), money(E.open)], [T('r_take'), money(E.take)], [T('r_sub'), money(E.sub)], [T('r_rent'), money(-E.rent)],
      [T('r_profit'), `<b class="${E.profit < 0 ? 'neg' : 'pos'}">${money(E.profit)}</b>`], [T('r_gmv'), money(E.gmv)], [T('r_cov'), pctf(E.cov)], [T('r_loss'), (E.loss * 100).toFixed(1) + '%'], [T('r_cold'), E.cold],
      [T('r_rep'), (E.repD >= 0 ? '+' : '') + E.repD + ' → ' + Math.round(E.rep)], [T('r_cash'), money(E.cash)]];
    const nt = E.notes.map(n => `<p class="warn">${T(n[0], { c: tr().cn[n[1]], cat: n[2] ? T('c_' + n[2]) : '', n: n[3] })}</p>`).join('');
    $('card').innerHTML = `<div class="eyebrow">${T('e_eyebrow', { d: E.day })}</div><h2>${T(E.profit >= 0 ? 'made' : 'lost', { x: money(Math.abs(E.profit)) })}</h2>${nt}
      <table class="rep"><tbody>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table>
      <p class="hint">${T(E.tip)}</p><div class="row"><button class="primary" id="go">${T(E.broke ? 'go_broke' : E.last ? 'go_last' : 'go_next')}</button></div>`;
    $('go').onclick = () => { if (E.broke || E.last) return finale(E.broke); G.day++; morning(); };
  });
  renderHud();
}
function valuation(broke) {
  const last3 = G.hist.slice(-3), n = Math.max(1, last3.length);
  const arr = last3.reduce((a, h) => a + h.rev, 0) / n * 365;
  const gm = last3.reduce((a, h) => a + h.rev - h.cost, 0) / Math.max(1, last3.reduce((a, h) => a + h.gmv, 0));
  const cr = {}; let tot = 0; for (const h of last3) for (const [k, v] of Object.entries(h.custRev)) { tot += v; if (k !== 'self') cr[k] = (cr[k] || 0) + v; }
  const top = Math.max(0, ...Object.values(cr)) / Math.max(1, tot);
  const nx = CATALOG.filter(m => isTurbo(m) || (G.turbo[m.id] && G.turbo[m.id] <= G.day + 1)).length;
  const parts = [['f_base', 4], ['f_rep', +(G.rep / 12).toFixed(1)], ['f_excl', 2.5 * nx], ['f_margin', gm > .2 ? 2 : gm > .1 ? 1 : 0], ['f_conc', top > .3 ? -3 : 0]];
  const mult = Math.max(1, parts.reduce((a, p) => a + p[1], 0));
  return { arr, gm, top, nx, parts, mult, val: broke ? 0 : arr * mult };
}
function finale(broke) {
  const V = valuation(broke);
  let best = 0; try { best = +localStorage.getItem('gpuhotel-mkt-best') || 0; if (V.val > best) localStorage.setItem('gpuhotel-mkt-best', Math.round(V.val)); } catch (e) {}
  const rank = broke ? 'rank_broke' : V.val > 130e6 ? 'rank1' : V.val > 80e6 ? 'rank2' : V.val > 45e6 ? 'rank3' : 'rank4';
  const F = { ...V, best: Math.max(best, V.val), rep: Math.round(G.rep), profit7: G.hist.reduce((a, h) => a + h.profit, 0), cash: G.cash };
  showCard(() => {
    const lbl = { f_base: T('f_base'), f_rep: T('f_rep', { r: F.rep }), f_excl: T('f_excl', { n: F.nx }), f_margin: T('f_margin', { p: pctf(F.gm) }), f_conc: T('f_conc', { p: pctf(F.top) }) };
    $('card').innerHTML = `<div class="eyebrow">${T('f_eyebrow')}</div><h2>${T(rank)}</h2><div class="big">${money(F.val)}</div>
      <table class="rep"><tbody><tr><td>${T('f_arr')}</td><td>${money(F.arr)}</td></tr>
      ${F.parts.map(p => `<tr><td>${lbl[p[0]]}</td><td>${p[1] >= 0 ? '+' : ''}${p[1]}×</td></tr>`).join('')}
      <tr><td><b>${T('f_mult')}</b></td><td><b>${F.mult.toFixed(1)}×</b></td></tr>
      <tr><td>${T('f_profit')}</td><td>${money(F.profit7)}</td></tr><tr><td>${T('f_cash')}</td><td>${money(F.cash)}</td></tr><tr><td>${T('f_best')}</td><td>${money(F.best)}</td></tr></tbody></table>
      <p class="src">${T('f_note')}</p>
      <div class="row"><button class="primary" id="again">${T('again')}</button></div>`;
    $('again').onclick = () => location.reload();
  });
}

// ================= UI =================
let cells = [];
function buildGrid() { $('grid').innerHTML = ''; cells = gpus.map(() => { const d = document.createElement('div'); d.className = 'w'; $('grid').appendChild(d); return d; }); }
function buildShelf() {
  const listed = CATALOG.filter(isListed);
  $('shelf').innerHTML = `<h2>${T('shelf')}</h2>` + CK.map(c => {
    const ms = listed.filter(m => m.cat === c);
    return `<div class="catgrp" style="--c:var(--${c})"><h3>${T('c_' + c)}</h3>${ms.length ? ms.map(m => `<div class="mrow ${m.kind}" style="--c:var(--${c})">
      <div class="mhead"><b>${m.name}</b><small>${m.lab}</small><span class="bdg ${m.kind === 'closed' ? 'closed' : isTurbo(m) ? 'turbo' : ''}">${T(isTurbo(m) ? 'k_turbo' : 'k_' + m.kind)}</span></div>
      <div class="stat"><div class="qbar"><i id="qb-${m.id}"></i></div><div class="nums" id="mn-${m.id}"></div></div>
      ${m.kind === 'open' ? `<div class="ctl"><label for="mw-${m.id}">${T('mw')}</label><input type="range" id="mw-${m.id}" min="0" max="60" value="${P.minWarm[m.id] || 0}"><output id="o-mw-${m.id}"></output></div>` : ''}</div>`).join('') : `<p class="hint">${T('shelf_none')}</p>`}</div>`;
  }).join('');
  sync();
}
function sync() {
  for (const m of openListed()) { const el = $('mw-' + m.id); if (!el) continue; P.minWarm[m.id] = +el.value; $('o-mw-' + m.id).textContent = P.minWarm[m.id]; }
  P.keep = +$('keep').value; P.win = $('win').value / 100; P.surge = $('surge').value / 100; P.policy = $('policy').value;
  $('o-keep').textContent = P.keep + 's'; $('o-win').textContent = Math.round(P.win * 100) + '%'; $('o-surge').textContent = '×' + P.surge.toFixed(1);
}
document.addEventListener('input', sync);
function setPaused(v) { paused = v; $('pause').setAttribute('aria-pressed', v); $('pause').textContent = T(v ? 'resume' : 'pause'); }
$('pause').onclick = () => { if (running) setPaused(!paused); };
document.querySelectorAll('.spd').forEach(b => b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('.spd').forEach(x => x.setAttribute('aria-pressed', x === b)); });
$('burst').onclick = () => {
  if (!running || D.bursts >= 3) return; D.bursts++;
  const p = (RATE.burst * D.burstMult).toFixed(1);
  for (let i = 0; i < 10; i++) { const g = mk('burst', RATE.burst * D.burstMult); g.state = 'down'; g.until = t + 45; gpus.push(g); }
  buildGrid(); say(() => T('b_msg', { p }));
};
$('limit').onclick = () => { if (!running) return; D.limit = !D.limit; $('limit').setAttribute('aria-pressed', D.limit); const on = D.limit; say(() => T(on ? 'l_on' : 'l_off')); };

// language picker
function buildMenu() {
  $('langMenu').innerHTML = LANGS.map(([id, code, name]) => `<button role="menuitemradio" aria-checked="${id === lang}" data-l="${id}"><span>${name}</span><small>${code}</small></button>`).join('');
  $('langMenu').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { setLang(b.dataset.l); closeMenu(); $('langBtn').focus(); });
}
function openMenu() { buildMenu(); $('langMenu').hidden = false; $('langBtn').setAttribute('aria-expanded', 'true'); const cur = $('langMenu').querySelector('[aria-checked="true"]'); cur && cur.focus(); }
function closeMenu() { $('langMenu').hidden = true; $('langBtn').setAttribute('aria-expanded', 'false'); }
$('langBtn').onclick = e => { e.stopPropagation(); $('langMenu').hidden ? openMenu() : closeMenu(); };
document.addEventListener('click', e => { if (!$('langMenu').hidden && !e.target.closest('.lang')) closeMenu(); });
document.addEventListener('keydown', e => {
  if ($('langMenu').hidden) return;
  if (e.key === 'Escape') { closeMenu(); $('langBtn').focus(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); const items = [...$('langMenu').querySelectorAll('button')], k = items.indexOf(document.activeElement);
    items[(k + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
  }
});
function setLang(id) { lang = L[id] ? id : 'en'; try { localStorage.setItem('gpuhotel-lang', lang); } catch (e) {} applyLang(); }
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  $('langCode').textContent = LANGS.find(l => l[0] === lang)[1];
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', T(el.dataset.i18nAria)));
  $('basis').innerHTML = `<thead><tr>${T('bcols').map(x => `<td>${x}</td>`).join('')}</tr></thead><tbody>${T('brows').map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</tbody>`;
  setPaused(paused); renderOwned(); buildShelf();
  if (lastSay) $('ticker').textContent = lastSay();
  if (!$('veil').hidden && cardView) cardView();
  if (D) render();
}

const cv = $('chart'), cx = cv.getContext('2d');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL = { img: css('--img'), vid: css('--vid'), aud: css('--aud'), rule: css('--rule'), muted: css('--muted') };
function drawChart() {
  const W = cv.width, H = cv.height, pad = 40, top = Math.max(100, gpus.length); cx.clearRect(0, 0, W, H);
  cx.font = '20px sans-serif'; cx.fillStyle = COL.muted; cx.strokeStyle = COL.rule; cx.lineWidth = 1;
  const y = v => H - 8 - (H - 22) * v / top, x = i => pad + (W - pad) * i / (DAY / 6);
  for (const v of [0, 50, 100]) { cx.beginPath(); cx.moveTo(pad, y(v)); cx.lineTo(W, y(v)); cx.stroke(); cx.fillText(v, 0, y(v) + 6); }
  if (chart.length < 2) return;
  const base = chart.map(() => 0);
  CK.forEach((c, k) => {
    cx.beginPath(); chart.forEach((h, i) => cx.lineTo(x(i), y(base[i] + h[k])));
    for (let i = chart.length - 1; i >= 0; i--) cx.lineTo(x(i), y(base[i]));
    cx.closePath(); cx.fillStyle = COL[c]; cx.globalAlpha = .85; cx.fill(); cx.globalAlpha = 1;
    chart.forEach((h, i) => base[i] += h[k]);
  });
  cx.beginPath(); chart.forEach((h, i) => cx.lineTo(x(i), y(h[3]))); cx.strokeStyle = COL.muted; cx.setLineDash([6, 6]); cx.lineWidth = 2; cx.stroke(); cx.setLineDash([]);
}
function renderCust() {
  const tot = CUST.reduce((a, k) => a + D.kc[k.id].rev, 0);
  const uses = k => CK.filter(c => k.f[c]).map(c => T('c_' + c)).join(', ');
  const st = k => !G.act[k.id] ? (G.gone === k.id ? 'st_gone' : 'st_churn') : G.pm[k.id] ? 'st_deal' : G.strikes[k.id] ? 'st_strike' : 'st_active';
  const cols = T('ccols');
  $('ctab').innerHTML = `<thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${CUST.map(k => {
    const K = D.kc[k.id], s = st(k);
    return `<tr><td>${tr().cn[k.id]}</td><td>${uses(k)}</td><td class="n">${money(K.paid)}</td><td class="n">${money(K.rev)} <span style="color:var(--muted)">${tot > 0 ? pctf(K.rev / tot) : ''}</span></td><td class="${s === 'st_churn' || s === 'st_gone' ? 'neg' : s === 'st_strike' || s === 'st_deal' ? 'warn' : ''}">${T(s)}</td></tr>`;
  }).join('')}</tbody>`;
}
function renderHud() {
  $('k-day').textContent = T('day', { n: G.day });
  const hh = D.t / DAY * 24, time = `${String(Math.floor(hh) % 24).padStart(2, '0')}:${String(Math.floor(hh % 1 * 60)).padStart(2, '0')}`;
  $('k-clock').textContent = T('clock', { time, n: DAYS });
  const today = D.revOpen + D.revTake + D.sub - D.cost;
  $('k-cash').textContent = money(G.cash + (running ? today : 0)); $('k-cash').className = G.cash + today < 0 ? 'neg' : '';
  $('k-today').textContent = money(today); $('k-today').className = today < 0 ? 'neg' : 'pos';
  $('k-rep').textContent = Math.round(G.rep);
  const cov = D.inV + D.missV > 0 ? D.inV / (D.inV + D.missV) : 1;
  $('k-cov').textContent = pctf(cov); $('k-cov').className = cov < .7 ? 'warn' : '';
  $('k-lost').textContent = (D.lostV / Math.max(1, D.lostV + D.servedV) * 100).toFixed(1) + '%';
  $('dayline').style.width = D.t / DAY * 100 + '%';
  $('burst').disabled = !running || D.bursts >= 3;
  $('burst-hint').textContent = T('bhint', { b: (RATE.burst * D.burstMult).toFixed(1), o: RATE.own, s: RATE.sublet * (G.up.spot ? 2 : 1), n: 3 - D.bursts });
}
function render() {
  if (cells.length !== gpus.length) buildGrid();
  gpus.forEach((g, i) => { const m = g.m && MI[g.m]; const c = 'w ' + (g.state === 'off' ? '' : g.state === 'down' ? 'down' : g.state + ' ' + (m ? m.cat : '')) + (g.lane ? ' lane' : '') + (g.kind === 'burst' ? ' burst' : '') + (g.slow ? ' slow' : '') + (m && isTurbo(m) ? ' tb' : ''); if (cells[i].className !== c) cells[i].className = c; });
  // share of each category's market demand that each listed model is catching right now
  for (const c of CK) {
    const mkt = CATALOG.filter(m => m.cat === c && inMarket(m)), SA = mkt.reduce((a, m) => a + attract(m), 0);
    for (const m of mkt) {
      if (!isListed(m) || !$('mn-' + m.id)) continue;
      const share = SA ? pctf(attract(m) / SA) : '0%', q = Q[m.id] || [], p95 = pct(lat[m.id], .95), rev = money(D.mrev[m.id] || 0);
      if (m.kind === 'open') { $('qb-' + m.id).style.width = Math.min(100, q.length / (m.batch * 12) * 100) + '%'; $('mn-' + m.id).innerHTML = T('row_open', { share, cat: T('c_' + c), q: q.length, p: p95, r: cnt(m.id), rev }); }
      else { const u = D.capT[m.id] ? Math.min(1, (D.capU[m.id] || 0) / D.capT[m.id]) : 0; $('qb-' + m.id).style.width = (q.length ? 100 : u * 100) + '%'; $('mn-' + m.id).innerHTML = T('row_closed', { share, cat: T('c_' + c), u: pctf(u), p: p95, rev }); }
    }
  }
  renderCust(); renderHud(); drawChart();
}
setInterval(() => { if (!paused && running) for (let i = 0; i < speed && running; i++) step(); }, 80);
setInterval(render, 200);
// headless balance hook: plays every day with a fixed strategy
window.__auto = (o = {}) => {
  for (; G.day <= DAYS; G.day++) {
    setupDay();
    for (const m of CATALOG) if (o.listAll && G.day >= availDay(m) && !removed(m) && !isListed(m) && !(o.skip || []).includes(m.id)) setListed(m, true);
    for (const id of o.turbo || []) if (!G.turbo[id] && isListed(MI[id]) && G.cash >= TURBO_COST) { G.cash -= TURBO_COST; G.turbo[id] = G.day + 1; }
    for (const u of o.ups || []) { const U = UPG.find(x => x.id === u); if (U && !G.up[u] && G.cash >= U.cost) { G.cash -= U.cost; G.up[u] = true; if (u === 'deal') for (let i = 0; i < 30; i++) gpus.push(mk('own', RATE.contract)); if (u === 'devprog') { G.rep = Math.min(100, G.rep + 8); G.selfMult *= 1.1; } } }
    for (const m of openListed()) if (P.minWarm[m.id] == null) P.minWarm[m.id] = 2;
    if (o.mw) Object.assign(P.minWarm, o.mw);
    const ev = EVENTS[G.day - 1]; if (ev.choices) ev.choices[o.pick ? o.pick(G.day) : 1].fn();
    openDay(); while (running) step();
    if (G.cash < -20000) return { broke: true, hist: G.hist, rep: G.rep };
  }
  G.day = DAYS; const V = valuation(false);
  return { cash: G.cash, rep: G.rep, hist: G.hist, V };
};
applyLang();
morning();
</script>
