<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPU Hotel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a night-time hotel facade (one window per GPU) on the left, the front desk on the right, morning briefings as cards over the page, language picker pinned top-right above the cards. Single dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #0c111d; --panel: #141b2c; --panel2: #1a2338; --fg: #e8ebf3; --muted: #8d97ae; --rule: #28324a;
  --off: #1d2540; --gold: #f2b84b; --chat: #f5c15c; --img: #4fd1c5; --vid: #f0709a; --box: #9d8cf5; --bad: #ff6b5e; --good: #7bd88f;
  --num: "Space Grotesk", "Inter", "Noto Sans SC", system-ui, sans-serif;
  --body: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.6;
  padding-block: .75rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.topbar { display: flex; justify-content: flex-end; position: relative; z-index: 30; }
.lang { position: relative; }
#langBtn { display: inline-flex; align-items: center; gap: .55rem; padding: .3rem .7rem; }
#langBtn .code { font-family: var(--num); font-weight: 700; color: var(--gold); letter-spacing: .06em; }
#langBtn .caret { color: var(--muted); font-size: .7rem; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: .3rem; min-width: 11rem; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 10px 28px rgba(0, 0, 0, .45); }
.menu[hidden] { display: none; }
.menu button { width: 100%; text-align: left; background: transparent; border-color: transparent; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.menu button:hover { background: var(--panel2); }
.menu button[aria-checked="true"] { color: var(--gold); font-weight: 700; }
.menu button small { color: var(--muted); font-family: var(--num); font-weight: 500; }
header { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: flex-end; justify-content: space-between; }
h1 { font-family: var(--num); font-size: 1.75rem; line-height: 1.1; margin: 0; letter-spacing: .02em; color: var(--gold); text-shadow: 0 0 18px color-mix(in srgb, var(--gold) 45%, transparent); }
h1 span { font-family: var(--body); font-size: .95rem; color: var(--fg); font-weight: 500; text-shadow: none; margin-left: .6rem; letter-spacing: 0; }
.sub { margin: .25rem 0 0; color: var(--muted); max-width: 40rem; }
.bar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
button, select { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--rule); border-radius: 4px; padding: .35rem .7rem; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--gold); }
button:disabled { opacity: .45; cursor: default; }
button[aria-pressed="true"], button.primary { background: var(--gold); color: #1a1405; border-color: var(--gold); font-weight: 700; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .5rem; }
.kpi { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: .55rem .8rem; min-width: 0; }
.kpi b { display: block; font-family: var(--num); font-size: 1.3rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi span { color: var(--muted); font-size: .78rem; line-height: 1.35; display: block; }
.neg { color: var(--bad); } .pos { color: var(--good); }
.dayline { height: 6px; background: var(--off); border-radius: 3px; overflow: hidden; }
.dayline i { display: block; height: 100%; width: 0; background: var(--gold); }
.main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: .9rem 1rem; min-width: 0; }
.panel h2 { font-size: .8rem; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin: 0 0 .7rem; }
.facade { background: linear-gradient(#10172a, #0e1424); border: 1px solid var(--rule); border-top: 4px solid var(--gold); border-radius: 4px 4px 0 0; padding: .9rem; }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.w { aspect-ratio: 1 / .9; border-radius: 2px; background: var(--off); transition: background .2s; }
.w.chat { --c: var(--chat); } .w.img { --c: var(--img); } .w.vid { --c: var(--vid); } .w.box { --c: var(--box); }
.w.idle { background: color-mix(in srgb, var(--c) 26%, var(--off)); }
.w.busy { background: var(--c); box-shadow: 0 0 9px color-mix(in srgb, var(--c) 70%, transparent); }
.w.lane { opacity: .7; box-shadow: none; }
.w.loading { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 60%, var(--off)) 0 4px, var(--off) 4px 8px); animation: flick .7s steps(2) infinite; }
.w.down { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--bad) 55%, var(--off)) 0 3px, #120a10 3px 6px); }
.w.slow { outline: 1px solid var(--bad); outline-offset: 1px; }
.w.burst { outline: 1px dashed var(--gold); outline-offset: 1px; }
@keyframes flick { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .w.loading { animation: none; } .w { transition: none; } }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; color: var(--muted); font-size: .78rem; }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: 2px; vertical-align: -1px; margin-right: .35rem; }
.ticker { min-height: 1.5rem; color: var(--gold); font-size: .85rem; margin-top: .6rem; }
canvas { width: 100%; height: 120px; display: block; }
.room { border-top: 1px solid var(--rule); padding-top: .7rem; margin-top: .7rem; }
.room:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.room h3 { font-size: .92rem; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .6rem; }
.room h3 small { color: var(--muted); font-weight: 400; font-size: .76rem; }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .6rem; align-items: center; margin: .35rem 0 .45rem; }
.qbar { height: .55rem; background: var(--off); border-radius: 2px; overflow: hidden; }
.qbar i { display: block; height: 100%; width: 0; }
.nums { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.nums b { color: var(--fg); }
.ctl { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 3rem; gap: .2rem .6rem; align-items: center; margin-bottom: .3rem; }
.ctl.wide { grid-template-columns: minmax(0, 1fr) 3.4rem; } .ctl.wide label { grid-column: 1 / -1; }
.ctl label { font-size: .8rem; line-height: 1.35; }
.ctl output { font-family: var(--num); font-variant-numeric: tabular-nums; text-align: right; font-size: .85rem; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.hint { color: var(--muted); font-size: .78rem; margin: .3rem 0 0; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.owned { display: flex; flex-wrap: wrap; gap: .35rem; }
.owned span { font-size: .75rem; border: 1px solid var(--rule); border-radius: 3px; padding: .1rem .45rem; color: var(--muted); }
.veil { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 20;
  padding: calc(3.6rem + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.veil[hidden] { display: none; }
.card { background: var(--panel); border: 1px solid var(--rule); border-top: 4px solid var(--gold); border-radius: 4px; padding: 1.25rem 1.4rem; max-width: 42rem; width: 100%; display: flex; flex-direction: column; gap: .8rem; }
.card .eyebrow { font-family: var(--num); color: var(--gold); letter-spacing: .08em; font-size: .78rem; }
.card h2 { font-size: 1.35rem; margin: 0; line-height: 1.3; text-wrap: balance; }
.card p { margin: 0; }
.card .src { color: var(--muted); font-size: .8rem; border-left: 2px solid var(--rule); padding-left: .7rem; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(11.5rem, 1fr)); gap: .5rem; }
.opt { text-align: left; padding: .6rem .75rem; display: flex; flex-direction: column; gap: .15rem; }
.opt b { font-size: .9rem; } .opt small { color: var(--muted); font-size: .76rem; line-height: 1.45; }
.opt .cost { font-family: var(--num); color: var(--gold); font-size: .85rem; }
.opt.picked { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel2)); }
.card h3 { font-size: .8rem; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin: .3rem 0 0; }
table.rep { border-collapse: collapse; width: 100%; font-size: .88rem; }
.rep td { padding: .3rem 0; border-top: 1px solid var(--rule); }
.rep td:last-child { text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; padding-left: 1rem; }
.basis { min-width: 36rem; font-size: .8rem !important; }
.basis td { padding: .35rem .7rem .35rem 0 !important; text-align: left !important; font-family: var(--body) !important; vertical-align: top; }
.basis thead td { color: var(--muted); border-top: 0; }
.basis td:nth-child(2) { white-space: nowrap; font-family: var(--num) !important; }
.big { font-family: var(--num); font-size: 2.2rem; color: var(--gold); line-height: 1.1; }
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="lang">
      <button id="langBtn" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu"><span class="code" id="langCode">EN</span><span data-i18n="lang">Language</span><span class="caret" aria-hidden="true">▾</span></button>
      <div class="menu" id="langMenu" role="menu" hidden></div>
    </div>
  </div>
  <header>
    <div>
      <h1>GPU HOTEL<span data-i18n="sub"></span></h1>
      <p class="sub" data-i18n="intro"></p>
    </div>
    <div class="bar">
      <button id="pause" aria-pressed="false"></button>
      <button class="spd" data-s="1" aria-pressed="true">1×</button>
      <button class="spd" data-s="2" aria-pressed="false">2×</button>
      <button class="spd" data-s="4" aria-pressed="false">4×</button>
    </div>
  </header>

  <section class="kpis" data-i18n-aria="a_kpis">
    <div class="kpi"><b id="k-day"></b><span id="k-clock"></span></div>
    <div class="kpi"><b id="k-cash">$0</b><span data-i18n="k_cash"></span></div>
    <div class="kpi"><b id="k-today">$0</b><span data-i18n="k_today"></span></div>
    <div class="kpi"><b id="k-rep">60</b><span data-i18n="k_rep"></span></div>
    <div class="kpi"><b id="k-util">0%</b><span data-i18n="k_util"></span></div>
    <div class="kpi"><b id="k-lost">0%</b><span data-i18n="k_lost"></span></div>
  </section>
  <div class="dayline" aria-hidden="true"><i id="dayline"></i></div>

  <div class="main">
    <div class="col">
      <div>
        <div class="facade"><div class="grid" id="grid" data-i18n-aria="a_grid"></div></div>
        <div class="panel" style="border-top:0;border-radius:0 0 4px 4px">
          <div class="legend">
            <span><i style="background:var(--off)"></i><span data-i18n="lg_vac"></span></span>
            <span><i style="background:repeating-linear-gradient(135deg,var(--muted) 0 3px,var(--off) 3px 6px)"></i><span data-i18n="lg_prep"></span></span>
            <span><i style="background:color-mix(in srgb,var(--gold) 26%,var(--off))"></i><span data-i18n="lg_warm"></span></span>
            <span><i style="background:var(--gold)"></i><span data-i18n="lg_busy"></span></span>
            <span><i style="background:repeating-linear-gradient(45deg,var(--bad) 0 3px,#120a10 3px 6px)"></i><span data-i18n="lg_down"></span></span>
            <span><i style="background:var(--off);outline:1px solid var(--bad)"></i><span data-i18n="lg_slow"></span></span>
          </div>
          <div class="ticker" id="ticker" aria-live="polite"></div>
        </div>
      </div>
      <div class="panel">
        <h2 data-i18n="chart"></h2>
        <canvas id="chart" width="900" height="240"></canvas>
      </div>
      <div class="panel">
        <h2 data-i18n="owned"></h2>
        <div class="owned" id="owned"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel" id="rooms"></div>
      <div class="panel">
        <h2 data-i18n="policy"></h2>
        <div class="ctl wide"><label for="win" data-i18n="win"></label><input type="range" id="win" min="0" max="100" value="20"><output id="o-win"></output></div>
        <div class="ctl wide"><label for="surge" data-i18n="surge"></label><input type="range" id="surge" min="100" max="250" step="10" value="100"><output id="o-surge"></output></div>
        <div class="row" style="margin-top:.4rem"><label for="policy" data-i18n="order"></label>
          <select id="policy"><option value="fifo" data-i18n="o_fifo"></option><option value="rich" data-i18n="o_rich"></option><option value="short" data-i18n="o_short"></option></select>
        </div>
        <div class="row" style="margin-top:.8rem">
          <button id="burst" data-i18n="burst"></button>
          <button id="limit" aria-pressed="false" data-i18n="limit"></button>
        </div>
        <p class="hint" id="burst-hint"></p>
      </div>
    </div>
  </div>
  <div class="panel">
    <h2 data-i18n="basis"></h2>
    <div style="overflow-x:auto"><table class="rep basis" id="basis"></table></div>
    <p class="hint" data-i18n="bnote"></p>
  </div>
</div>
<div class="veil" id="veil" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

      <div class="row"><button class="primary" id="again">${T('again')}</button></div>`;

  });
}

// ---------- UI ----------
let cells = [];
function buildGrid() { $('grid').innerHTML = ''; cells = gpus.map(() => { const d = document.createElement('div'); d.className = 'w'; $('grid').appendChild(d); return d; }); }
function buildRooms() {
  $('rooms').innerHTML = `<h2>${T('rooms')}</h2>` + active().map(m => { const nm = tr().m[m.id]; return `<div class="room"><h3 style="color:var(--${m.id})">${nm[0]}<small>${T('meta', { room: nm[1], svc: svc(m).toFixed(1), cold: cold(m), batch: m.batch, pat: m.patience })}</small></h3>
    <div class="stat"><div class="qbar"><i id="qb-${m.id}" style="background:var(--${m.id})"></i></div><div class="nums" id="qn-${m.id}"></div></div>
    <div class="ctl"><label for="mw-${m.id}">${T('mw')}</label><input type="range" id="mw-${m.id}" min="0" max="60" value="${P.minWarm[m.id]}"><output id="o-mw-${m.id}"></output></div>
    <div class="ctl"><label for="kp-${m.id}">${T('kp')}</label><input type="range" id="kp-${m.id}" min="0" max="300" step="5" value="${P.keep[m.id]}"><output id="o-kp-${m.id}"></output></div></div>`; }).join('');
  sync();
}
function sync() {
  for (const m of active()) { if (!$('mw-' + m.id)) continue;
    P.minWarm[m.id] = +$('mw-' + m.id).value; P.keep[m.id] = +$('kp-' + m.id).value;
    $('o-mw-' + m.id).textContent = P.minWarm[m.id]; $('o-kp-' + m.id).textContent = P.keep[m.id] + 's'; }
  P.win = $('win').value / 100; P.surge = $('surge').value / 100; P.policy = $('policy').value;
  $('o-win').textContent = Math.round(P.win * 100) + '%'; $('o-surge').textContent = '×' + P.surge.toFixed(1);
}
document.addEventListener('input', sync);
function setPaused(v) { paused = v; $('pause').setAttribute('aria-pressed', v); $('pause').textContent = T(v ? 'resume' : 'pause'); }
$('pause').onclick = () => { if (running) setPaused(!paused); };
document.querySelectorAll('.spd').forEach(b => b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('.spd').forEach(x => x.setAttribute('aria-pressed', x === b)); });
$('burst').onclick = () => {
  if (!running || D.bursts >= 3) return; D.bursts++;
  const p = (RATE.burst * D.burstMult).toFixed(1);
  for (let i = 0; i < 10; i++) { const g = mk('burst', RATE.burst * D.burstMult); g.state = 'down'; g.until = t + 45; gpus.push(g); }
  buildGrid(); say(() => T('b_msg', { p }));
};
$('limit').onclick = () => { if (!running) return; D.limit = !D.limit; $('limit').setAttribute('aria-pressed', D.limit); const on = D.limit; say(() => T(on ? 'l_on' : 'l_off')); };

// language picker
function buildMenu() {
  $('langMenu').innerHTML = LANGS.map(([id, code, name]) => `<button role="menuitemradio" aria-checked="${id === lang}" data-l="${id}"><span>${name}</span><small>${code}</small></button>`).join('');
  $('langMenu').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { setLang(b.dataset.l); closeMenu(); $('langBtn').focus(); });
}
function openMenu() { buildMenu(); $('langMenu').hidden = false; $('langBtn').setAttribute('aria-expanded', 'true'); const cur = $('langMenu').querySelector('[aria-checked="true"]'); cur && cur.focus(); }
function closeMenu() { $('langMenu').hidden = true; $('langBtn').setAttribute('aria-expanded', 'false'); }
$('langBtn').onclick = e => { e.stopPropagation(); $('langMenu').hidden ? openMenu() : closeMenu(); };
document.addEventListener('click', e => { if (!$('langMenu').hidden && !e.target.closest('.lang')) closeMenu(); });
document.addEventListener('keydown', e => {
  if ($('langMenu').hidden) return;
  if (e.key === 'Escape') { closeMenu(); $('langBtn').focus(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); const items = [...$('langMenu').querySelectorAll('button')], k = items.indexOf(document.activeElement);
    items[(k + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
  }
});
function setLang(id) {
  lang = L[id] ? id : 'en';
  try { localStorage.setItem('gpuhotel-lang', lang); } catch (e) {}
  applyLang();
}
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  $('langCode').textContent = LANGS.find(l => l[0] === lang)[1];
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', T(el.dataset.i18nAria)));
  const c = T('bcols');
  $('basis').innerHTML = `<thead><tr>${c.map(x => `<td>${x}</td>`).join('')}</tr></thead><tbody>${T('brows').map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</tbody>`;
  setPaused(paused); renderOwned(); buildRooms();
  if (lastSay) $('ticker').textContent = lastSay();
  if (!$('veil').hidden && cardView) cardView();
  if (D) render();
}

const cv = $('chart'), cx = cv.getContext('2d');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL = { chat: css('--chat'), img: css('--img'), vid: css('--vid'), box: css('--box'), rule: css('--rule'), muted: css('--muted') };
function drawChart() {
  const W = cv.width, H = cv.height, pad = 40, top = Math.max(100, gpus.length); cx.clearRect(0, 0, W, H);
  cx.font = '20px sans-serif'; cx.fillStyle = COL.muted; cx.strokeStyle = COL.rule; cx.lineWidth = 1;
  const y = v => H - 8 - (H - 22) * v / top, x = i => pad + (W - pad) * i / (DAY / 6);
  for (const v of [0, 50, 100]) { cx.beginPath(); cx.moveTo(pad, y(v)); cx.lineTo(W, y(v)); cx.stroke(); cx.fillText(v, 0, y(v) + 6); }
  if (chart.length < 2) return;
  const act = active(), base = chart.map(() => 0);
  act.forEach((m, k) => {
    cx.beginPath(); chart.forEach((h, i) => cx.lineTo(x(i), y(base[i] + (h[k] || 0))));
    for (let i = chart.length - 1; i >= 0; i--) cx.lineTo(x(i), y(base[i]));
    cx.closePath(); cx.fillStyle = COL[m.id]; cx.globalAlpha = .85; cx.fill(); cx.globalAlpha = 1;
    chart.forEach((h, i) => base[i] += h[k] || 0);
  });
  cx.beginPath(); chart.forEach((h, i) => cx.lineTo(x(i), y(h[h.length - 1]))); cx.strokeStyle = COL.muted; cx.setLineDash([6, 6]); cx.lineWidth = 2; cx.stroke(); cx.setLineDash([]);
}
function renderHud() {
  $('k-day').textContent = T('day', { n: G.day });
  const hh = D.t / DAY * 24, time = `${String(Math.floor(hh) % 24).padStart(2, '0')}:${String(Math.floor(hh % 1 * 60)).padStart(2, '0')}`;
  $('k-clock').textContent = T('clock', { time, n: DAYS });
  const today = D.rev - D.cost;
  $('k-cash').textContent = money(G.cash + (running ? today : 0)); $('k-cash').className = G.cash + today < 0 ? 'neg' : '';
  $('k-today').textContent = money(today); $('k-today').className = today < 0 ? 'neg' : 'pos';
  $('k-rep').textContent = Math.round(G.rep); $('k-util').textContent = Math.round(D.util * 100) + '%';
  $('k-lost').textContent = (D.lostV / Math.max(1, D.lostV + D.servedV) * 100).toFixed(1) + '%';
  $('dayline').style.width = D.t / DAY * 100 + '%';
  $('burst').disabled = !running || D.bursts >= 3;
  $('burst-hint').textContent = T('bhint', { b: (RATE.burst * D.burstMult).toFixed(1), o: RATE.own, s: RATE.sublet * (G.up.spot ? 2 : 1), n: 3 - D.bursts });
}
function render() {
  if (cells.length !== gpus.length) buildGrid();
  gpus.forEach((g, i) => { const c = 'w ' + (g.state === 'off' ? '' : g.state === 'down' ? 'down' : g.state + ' ' + g.m) + (g.lane ? ' lane' : '') + (g.kind === 'burst' ? ' burst' : '') + (g.slow ? ' slow' : ''); if (cells[i].className !== c) cells[i].className = c; });
  for (const m of active()) { if (!$('qb-' + m.id)) continue;
    const q = Q[m.id]; $('qb-' + m.id).style.width = Math.min(100, q.length / (m.batch * 12) * 100) + '%';
    $('qn-' + m.id).innerHTML = T('qn', { q: q.length, p: pct(lat[m.id], .95), r: cnt(m.id) }); }
  renderHud(); drawChart();
}
setInterval(() => { if (!paused && running) for (let i = 0; i < speed && running; i++) step(); }, 80);
setInterval(render, 160);
window.__auto = pick => { for (; G.day <= DAYS; G.day++) { newDay(); const ev = EVENTS[G.day - 1]; ev.setup && ev.setup(); if (ev.choices && !(ev.skip && ev.skip())) ev.choices[pick ? pick(G.day) : 1].fn(); running = true; while (running) step(); if (G.cash < -20000) break; } return { cash: G.cash, rep: G.rep, hist: G.hist }; };
applyLang();
morning();
</script>
</body>
